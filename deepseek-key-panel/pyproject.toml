[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-key-panel"
version = "1.1.0"
description = "导入 DeepSeek API Key，批量查余额、验证可用性、看用量和消耗（网页版 + 命令行版，零依赖）"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "xiaoniao" }]
keywords = ["deepseek", "api-key", "balance", "usage", "token", "cli", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
deepseek-key-panel = "deepseek_key_panel.app:main"
dskp = "deepseek_key_panel.cli:main"

[project.urls]
Homepage = "https://github.com/xiaoniao/deepseek-key-panel"
Repository = "https://github.com/xiaoniao/deepseek-key-panel"
Issues = "https://github.com/xiaoniao/deepseek-key-panel/issues"
Changelog = "https://github.com/xiaoniao/deepseek-key-panel/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepseek_key_panel = ["web/*.html"]
